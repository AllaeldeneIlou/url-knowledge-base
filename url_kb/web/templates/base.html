<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}URL Knowledge Base{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <div class="app-title">URL Knowledge Base</div>
        <div class="app-subtitle">local review console</div>
      </div>
      <nav>
        <a href="/" class="{% if active == 'overview' %}active{% endif %}">Overview</a>
        <a href="/sources" class="{% if active == 'sources' %}active{% endif %}">Sources</a>
        <a href="/capture" class="{% if active == 'capture' %}active{% endif %}">Capture</a>
        <a href="/enrichments" class="{% if active == 'enrichments' %}active{% endif %}">Enrichments</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>© Allaeldene Ilou</footer>
  </body>
</html>
