name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run ruff
        run: python -m ruff check .

      - name: Check whitespace
        run: git diff --check

      - name: Check private artifacts are not tracked
        run: |
          if git ls-files | grep -E '(^data/|^outputs/|^private/|^raw_exports/|\.env$|\.sqlite3$|\.sqlite$|\.db$|(^|/)\\._)'; then
            echo "Private/generated artifact is tracked."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t url-kb:ci .

      - name: Seed demo database
        run: docker run --rm -v "$PWD/data:/app/data" url-kb:ci url-kb ingest_batch samples/public_urls.csv --database-url sqlite:///./data/url_kb.sqlite3

      - name: Run container
        run: docker run -d --name url-kb-ci -p 8000:8000 -v "$PWD/data:/app/data" url-kb:ci

      - name: Smoke test web endpoints
        run: |
          python - <<'PY'
          import time
          import urllib.request

          urls = [
              "http://127.0.0.1:8000/health",
              "http://127.0.0.1:8000/",
              "http://127.0.0.1:8000/sources",
              "http://127.0.0.1:8000/capture",
          ]

          deadline = time.time() + 30
          last_error = None
          while time.time() < deadline:
              try:
                  for url in urls:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          assert response.status == 200, (url, response.status)
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"web smoke failed: {last_error}")
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker logs url-kb-ci || true
