[project]
name = "url-knowledge-base"
version = "0.1.0"
description = "Local-first URL ingestion and retrieval prototype."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142.0",
  "jinja2>=3.1.0",
  "uvicorn>=0.54.0",
]

[project.scripts]
url-kb = "url_kb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
include = ["url_kb*"]
exclude = ["samples*", "tests*"]

[tool.setuptools.package-data]
"url_kb.web" = ["templates/*.html", "static/*.css"]
